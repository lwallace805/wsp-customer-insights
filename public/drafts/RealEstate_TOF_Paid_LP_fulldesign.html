  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6a6ee22b-c888-4506-8b0b-301dd53bbb7d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =========================================================================\n   Wharton Online × Wall Street Prep — Colors & Type\n   The single source of truth for tokens used everywhere in the system.\n   ========================================================================= */\n\n/* ---------- Whitney font family (all weights) -------------------------- */\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"86498b55-8b4e-412f-8dfc-6dbaffb35feb\") format(\"opentype\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"b8d039bc-013b-497c-b30a-013677b9ea41\") format(\"opentype\");\n  font-weight: 300;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"8b21405d-5244-4f8e-9e82-647a13bbdd58\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"752e79df-3e4b-4975-a519-ce576220a3d3\") format(\"opentype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"ca95927e-58e8-411c-95b7-8e78c8265300\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"9f1a5e7a-48ab-4678-a347-a20a64943720\") format(\"opentype\");\n  font-weight: 500;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"78721152-731a-45b5-af59-cf8ed89ecf2b\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"519e551d-833f-40ad-8b44-66aa2540587d\") format(\"opentype\");\n  font-weight: 600;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Whitney\";\n  src: url(\"feee5d6a-a619-4a0c-baa6-9d9b561c524f\") format(\"opentype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---------- Tokens ----------------------------------------------------- */\n:root {\n  /* === Brand colors ===\n     Penn / Wharton has two heritage hues that anchor everything:\n     Penn Red (the shield's top stripe, the heritage red used on the marks)\n     and Penn Blue (the deep navy used by Wharton & WSP wordmarks).\n     Every layout in this system is built on a Navy/Cream/Red triad. */\n\n  --wharton-blue:     #011f5b;   /* Primary navy — Wharton wordmark, Wall Street Prep wordmark */\n  --wharton-blue-deep:#011848;   /* Darker navy used on full-bleed hero panels in the sample ads */\n  --wharton-blue-ink: #01153a;   /* Near-black navy for dense text on marine-gray backgrounds */\n  --wharton-red:      #990000;   /* Wharton Red — heritage red on the shield + reverse logo. NEVER as a background. */\n\n  /* Secondary blues. Bay Blue is the headline-emphasis color on navy.\n     Pacific Blue is a deeper accent for date callouts and links on light. */\n  --bay-blue:         #06aafc;\n  --pacific-blue:     #026cb5;\n\n  /* Backwards-compatible aliases so existing pages keep rendering */\n  --penn-blue:        var(--wharton-blue);\n  --penn-blue-deep:   var(--wharton-blue-deep);\n  --penn-blue-ink:    var(--wharton-blue-ink);\n  --penn-red:         var(--wharton-red);\n  --sky-accent:       var(--bay-blue);\n  --sky-accent-soft:  #8cc6ff;\n  --marine:           var(--pacific-blue);\n\n  /* === Neutrals ===\n     The cream paper color that recurs across half the social tiles, plus\n     a small range of warm-grays that sit on it without going cold. */\n  --marine-gray:      #eeedea;   /* Primary \"paper\" background */\n  --marine-gray-soft: #f5f4f1;   /* Lighter card surface */\n  --marine-gray-warm: #e3e1dc;   /* Stat-block / quote-block fill */\n  --paper:            #ffffff;\n  /* Aliases */\n  --cream:            var(--marine-gray);\n  --cream-soft:       var(--marine-gray-soft);\n  --cream-warm:       var(--marine-gray-warm);\n  --ink:              #15171c;   /* Body text on cream */\n  --ink-muted:        #4d525c;   /* Secondary text on cream */\n  --ink-faint:        #8a8f99;   /* Captions, fine print on cream */\n  --rule:             #d2d0ca;   /* Divider lines on cream */\n  --rule-on-navy:     rgba(255,255,255,0.18);\n\n  /* === Type ===\n     Whitney is the brand sans. It's a humanist sans with strong, friendly\n     headline weights. We never mix it with another sans. */\n  --font-sans: \"Whitney\", \"Inter\", system-ui, -apple-system, \"Segoe UI\", Helvetica, Arial, sans-serif;\n\n  /* Type scale — derived from how the social ads stack copy on a 1200pt canvas\n     and adjusted for web reading. We commit to a fixed scale; do NOT invent\n     in-between sizes. */\n  --t-display:   72px;   /* Earn-your-cert hero */\n  --t-h1:        56px;   /* Page hero */\n  --t-h2:        40px;   /* Section heading */\n  --t-h3:        28px;   /* Card title */\n  --t-h4:        22px;   /* Sub-section / stat label heading */\n  --t-lede:      20px;   /* Lede paragraph under hero */\n  --t-body:      17px;   /* Body */\n  --t-small:     15px;   /* Secondary / meta */\n  --t-eyebrow:   13px;   /* All-caps eyebrow */\n  --t-fine:      12px;   /* Disclaimer fine print */\n\n  /* Tracking — Whitney looks best with a hair of negative tracking on display\n     sizes and tight, even tracking on the all-caps eyebrows we use heavily. */\n  --tr-display:  -0.01em;\n  --tr-eyebrow:  0.14em;\n  --tr-button:   0.04em;\n\n  /* === Spacing (4pt grid) === */\n  --s-1:  4px;\n  --s-2:  8px;\n  --s-3:  12px;\n  --s-4:  16px;\n  --s-5:  24px;\n  --s-6:  32px;\n  --s-7:  48px;\n  --s-8:  64px;\n  --s-9:  96px;\n  --s-10: 128px;\n\n  /* === Radius ===\n     Penn marketing material is square, sharp, and traditional. We allow a\n     hairline 2px radius on form controls but corners are otherwise crisp. */\n  --r-0: 0; /* @kind radius */\n  --r-1: 2px;\n  --r-2: 4px;        /* used on small chips */\n  --r-pill: 999px;   /* used only on certificate-program tags */\n\n  /* === Shadows ===\n     Used sparingly; the brand prefers flat planes and the cream/navy contrast\n     to do the heavy lifting. */\n  --shadow-card:   0 1px 2px rgba(0, 26, 54, 0.06), 0 8px 24px rgba(0, 26, 54, 0.06);\n  --shadow-pop:    0 4px 12px rgba(0, 26, 54, 0.10), 0 24px 48px rgba(0, 26, 54, 0.12);\n\n  /* === Layout === */\n  --container:     1200px;\n  --container-wide:1320px;\n  --gutter:        var(--s-5);\n}\n\n/* ---------- Base resets used inside the design system pages ----------- */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody {\n  font-family: var(--font-sans);\n  color: var(--ink);\n  background: var(--cream);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"kern\" 1, \"liga\" 1;\n}\n\n/* ---------- Reusable type classes ------------------------------------- */\n/* Use these instead of hand-setting font sizes. */\n.t-display { font-size: var(--t-display); font-weight: 700; line-height: 1.02; letter-spacing: var(--tr-display); }\n.t-h1      { font-size: var(--t-h1);      font-weight: 700; line-height: 1.05; letter-spacing: -0.005em; }\n.t-h2      { font-size: var(--t-h2);      font-weight: 700; line-height: 1.10; letter-spacing: -0.005em; }\n.t-h3      { font-size: var(--t-h3);      font-weight: 600; line-height: 1.20; }\n.t-h4      { font-size: var(--t-h4);      font-weight: 600; line-height: 1.25; }\n.t-lede    { font-size: var(--t-lede);    font-weight: 400; line-height: 1.45; }\n.t-body    { font-size: var(--t-body);    font-weight: 400; line-height: 1.55; }\n.t-small   { font-size: var(--t-small);   font-weight: 400; line-height: 1.50; }\n.t-eyebrow {\n  font-size: var(--t-eyebrow);\n  font-weight: 600;\n  line-height: 1.2;\n  letter-spacing: var(--tr-eyebrow);\n  text-transform: uppercase;\n}\n.t-fine    { font-size: var(--t-fine);    font-weight: 400; line-height: 1.4; color: var(--ink-faint); font-style: italic; }\n\n/* Inline emphasis used in the ads — a light/blue accent word inside a\n   larger headline. Never use a third color in the same headline. */\n.em-accent { color: var(--sky-accent); }\n.em-red    { color: var(--penn-red); }\n\n/* Utility: divider pipe used in meta rows (\"8 WEEKS | ONLINE | STARTS JUNE 8\") */\n.pipe { display:inline-block; width:1px; height:0.9em; background: currentColor; opacity:0.45; margin: 0 var(--s-4); vertical-align: -0.05em; }\n<\u002Fstyle>\n<script src=\"f9699676-c070-4a15-b5db-6e3e2d94aeb1\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; }\n  @media (max-width: 720px) { .wsp-hide-mobile { display: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"font-family: var(--font-sans); color: var(--ink); background: var(--paper); line-height: 1.5; overflow-x: hidden;\">\n\n  <!-- 1. ANNOUNCEMENT BAR -->\n  <div style=\"background: var(--wharton-blue); color: #fff; text-align: center; font-size: 14px; font-weight: 500; letter-spacing: 0.01em; padding: 10px 20px;\">\n    Next cohort begins <strong style=\"font-weight: 700;\">{{ cohortStart }}<\u002Fstrong>. <span style=\"color: var(--bay-blue); font-weight: 600;\">Enrollment closes {{ enrollDeadline }}.<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- 2. HEADER -->\n  <header style=\"position: sticky; top: 0; z-index: 50; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 12px clamp(20px, 5vw, 40px); display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n    <img src=\"acaf3145-6a78-42e2-b7ec-511aed26b08a\" alt=\"Wharton Online and Wall Street Prep\" style=\"height: 34px; width: auto; display: block;\">\n    <a href=\"#lead\" style=\"background: var(--wharton-red); color: #fff; text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: 0.03em; padding: 11px 20px; border-radius: 2px; white-space: nowrap;\" style-hover=\"background: #7a0000;\">Get the Syllabus<\u002Fa>\n  <\u002Fheader>\n\n  <!-- 3. HERO -->\n  <section style=\"background: var(--wharton-blue); color: #fff; padding: clamp(48px, 7vw, 84px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 64px); align-items: flex-start;\">\n\n      <div style=\"flex: 1 1 440px; min-width: 300px;\">\n        <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bay-blue); margin-bottom: 18px;\">8-Week Online Certificate · Wharton Online<\u002Fdiv>\n        <h1 style=\"font-size: clamp(34px, 5vw, 54px); font-weight: 700; line-height: 1.04; letter-spacing: -0.01em; margin: 0 0 20px;\">Build the real estate financial models <span style=\"color: var(--bay-blue);\">institutional investors actually use.<\u002Fspan><\u002Fh1>\n        <p style=\"font-size: clamp(17px, 2vw, 20px); line-height: 1.5; color: rgba(255,255,255,0.82); max-width: 560px; margin: 0 0 32px;\">An 8-week online certificate from Wharton Online in the real estate modeling and underwriting methods used by institutional investors. Commercial real estate training focused on how deals actually get underwritten and closed.<\u002Fp>\n\n        <!-- Fact strip -->\n        <div style=\"display: flex; flex-wrap: wrap; gap: 1px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.16); border-radius: 3px; overflow: hidden; max-width: 620px;\">\n          <div style=\"flex: 1 1 120px; background: var(--wharton-blue); padding: 14px 16px;\">\n            <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 4px;\">Duration<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 700;\">8 weeks<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1 1 120px; background: var(--wharton-blue); padding: 14px 16px;\">\n            <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 4px;\">Weekly load<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 700;\">8–10 hrs+<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1 1 120px; background: var(--wharton-blue); padding: 14px 16px;\">\n            <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 4px;\">Format<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 700;\">100% online<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1 1 120px; background: var(--wharton-blue); padding: 14px 16px;\">\n            <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 4px;\">Next cohort<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 700;\">{{ cohortStartShort }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1 1 140px; background: var(--wharton-blue); padding: 14px 16px;\">\n            <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 4px;\">Tuition<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 700;\">$5,000 <span style=\"font-weight: 400; color: rgba(255,255,255,0.7); font-size: 14px;\">or $1,000/mo ×5<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Lead form card -->\n      <div id=\"lead\" style=\"flex: 1 1 380px; min-width: 300px; max-width: 440px; background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: 0 4px 12px rgba(0,26,54,0.18), 0 24px 48px rgba(0,26,54,0.22); padding: clamp(24px, 3vw, 32px); scroll-margin-top: 84px;\">\n        <h2 style=\"font-size: 23px; font-weight: 700; line-height: 1.2; margin: 0 0 6px; color: var(--wharton-blue);\">Get the full syllabus<\u002Fh2>\n        <p style=\"font-size: 15px; color: var(--ink-muted); margin: 0 0 20px;\">See every module, the guest speakers, and your tuition options.<\u002Fp>\n        <form onsubmit=\"{{ onSubmit1 }}\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <input name=\"first_name\" type=\"text\" required=\"required\" placeholder=\"First name\" style=\"width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n          <input name=\"email\" type=\"email\" required=\"required\" placeholder=\"Work email\" style=\"width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n          <select name=\"role\" required=\"required\" style=\"width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n            <option value=\"\" disabled=\"disabled\" selected=\"selected\">Current role<\u002Foption>\n            <option>CRE professional / broker / operator<\u002Foption>\n            <option>Acquisitions analyst<\u002Foption>\n            <option>Asset manager<\u002Foption>\n            <option>Career switcher into real estate<\u002Foption>\n            <option>Private / individual investor<\u002Foption>\n            <option>Student<\u002Foption>\n            <option>Other<\u002Foption>\n          <\u002Fselect>\n          <button type=\"submit\" style=\"width: 100%; font-family: inherit; background: var(--wharton-red); color: #fff; font-weight: 700; font-size: 17px; letter-spacing: 0.03em; padding: 15px; border: none; border-radius: 2px; cursor: pointer; margin-top: 2px;\" style-hover=\"background: #7a0000;\">Get the Syllabus<\u002Fbutton>\n        <\u002Fform>\n        <sc-if value=\"{{ sent1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size: 14px; color: var(--wharton-red); font-weight: 600; margin: 12px 0 0;\">Thanks, {{ name1 }}. Your syllabus is on its way; check your inbox.<\u002Fp>\n        <\u002Fsc-if>\n        <p style=\"font-size: 13px; color: var(--ink-faint); margin: 14px 0 0; line-height: 1.4;\">Full curriculum, guest speakers, and tuition options. No spam.<\u002Fp>\n        <p style=\"font-size: 14px; text-align: center; margin: 16px 0 0;\"><a href=\"#advisor\" style=\"color: var(--pacific-blue); font-weight: 600; text-decoration: none;\">Talk to an Enrollment Advisor<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4. OUTCOMES -->\n  <section style=\"background: var(--paper); padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--wharton-red); margin-bottom: 14px;\">What you will be able to do<\u002Fdiv>\n      <h2 style=\"font-size: clamp(28px, 4vw, 40px); font-weight: 700; line-height: 1.1; letter-spacing: -0.005em; color: var(--wharton-blue); margin: 0 0 40px; max-width: 720px;\">Leave with the modeling skills that get real estate analysts taken seriously.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule);\">\n        <div style=\"background: #fff; padding: 28px 26px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 12px;\">01<\u002Fdiv>\n          <p style=\"font-size: 18px; font-weight: 600; line-height: 1.35; margin: 0; color: var(--ink);\">Build institutional-quality real estate models from a blank workbook.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; padding: 28px 26px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 12px;\">02<\u002Fdiv>\n          <p style=\"font-size: 18px; font-weight: 600; line-height: 1.35; margin: 0; color: var(--ink);\">Underwrite acquisitions and development deals across property types.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; padding: 28px 26px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 12px;\">03<\u002Fdiv>\n          <p style=\"font-size: 18px; font-weight: 600; line-height: 1.35; margin: 0; color: var(--ink);\">Structure partnership waterfalls, preferred returns, and GP promote.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; padding: 28px 26px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 12px;\">04<\u002Fdiv>\n          <p style=\"font-size: 18px; font-weight: 600; line-height: 1.35; margin: 0; color: var(--ink);\">Prepare offering memoranda and present opportunities in institutional format.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5. CREDIBILITY STRIP -->\n  <section style=\"background: var(--cream); padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: clamp(28px, 5vw, 56px);\">\n        <div style=\"flex: 1 1 320px;\">\n          <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--wharton-red); margin-bottom: 12px;\">Wharton Online<\u002Fdiv>\n          <p style=\"font-size: 19px; line-height: 1.5; margin: 0; color: var(--ink);\">Academic rigor from the Wharton School, the finance faculty behind one of the most recognized names in business education.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 320px;\">\n          <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--wharton-red); margin-bottom: 12px;\">Wall Street Prep<\u002Fdiv>\n          <p style=\"font-size: 19px; line-height: 1.5; margin: 0; color: var(--ink);\">The modeling curriculum used to train incoming analysts at global investment banks and private equity firms; the same training used inside firms like KKR, Fannie Mae, and Artemis Real Estate Partners.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6. WHO THIS IS FOR -->\n  <section style=\"background: var(--paper); padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 64px);\">\n      <div style=\"flex: 1 1 300px; min-width: 280px;\">\n        <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--wharton-red); margin-bottom: 14px;\">Who this is for<\u002Fdiv>\n        <h2 style=\"font-size: clamp(26px, 3.5vw, 36px); font-weight: 700; line-height: 1.12; color: var(--wharton-blue); margin: 0 0 20px;\">Built for people who touch real estate deals.<\u002Fh2>\n        <div style=\"background: var(--cream); border-left: 3px solid var(--wharton-red); padding: 18px 20px;\">\n          <p style=\"font-size: 16px; line-height: 1.5; margin: 0; color: var(--ink-muted);\">This is an Excel-intensive program. The advertised load is 8 to 10 hours per week; committed learners routinely spend more. If you want a survey course, this is not it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 380px; min-width: 300px;\">\n        <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;\">\n          <li style=\"font-size: 18px; line-height: 1.4; padding: 16px 0; border-bottom: 1px solid var(--rule); color: var(--ink);\">Commercial real estate professionals, brokers, and operators moving into underwriting<\u002Fli>\n          <li style=\"font-size: 18px; line-height: 1.4; padding: 16px 0; border-bottom: 1px solid var(--rule); color: var(--ink);\">Acquisitions analysts building institutional-grade models<\u002Fli>\n          <li style=\"font-size: 18px; line-height: 1.4; padding: 16px 0; border-bottom: 1px solid var(--rule); color: var(--ink);\">Career switchers into real estate private equity (REPE)<\u002Fli>\n          <li style=\"font-size: 18px; line-height: 1.4; padding: 16px 0; border-bottom: 1px solid var(--rule); color: var(--ink);\">Asset managers deepening their analysis and underwriting<\u002Fli>\n          <li style=\"font-size: 18px; line-height: 1.4; padding: 16px 0; color: var(--ink);\">Private investors scaling from small multifamily to commercial<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7. PROOF -->\n  <section style=\"background: var(--wharton-blue); color: #fff; padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bay-blue); margin-bottom: 14px;\">From the people who took it<\u002Fdiv>\n      <h2 style=\"font-size: clamp(26px, 3.5vw, 36px); font-weight: 700; line-height: 1.12; margin: 0 0 40px; max-width: 640px;\">Not endorsements. Results, in their words.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;\">\n        <blockquote style=\"margin: 0; background: rgba(255,255,255,0.06); border-top: 3px solid var(--bay-blue); padding: 26px 24px;\">\n          <p style=\"font-size: 17px; line-height: 1.55; margin: 0 0 16px; color: rgba(255,255,255,0.95);\">I am already applying the financial modeling concepts I learned here in real time to a development project I am currently brokering. Using the program's framework, I prepared an impressive offering memorandum for the prospective buyer's team.<\u002Fp>\n          <cite style=\"font-size: 13px; font-style: normal; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bay-blue);\">Winter 2026 cohort<\u002Fcite>\n        <\u002Fblockquote>\n        <blockquote style=\"margin: 0; background: rgba(255,255,255,0.06); border-top: 3px solid var(--bay-blue); padding: 26px 24px;\">\n          <p style=\"font-size: 17px; line-height: 1.55; margin: 0 0 16px; color: rgba(255,255,255,0.95);\">This class has been extremely informative and given me a lot more confidence in my underwriting. Not only did I improve my excel capabilities but I feel my increased knowledge base and professional layouts gets me taken more seriously in round tables.<\u002Fp>\n          <cite style=\"font-size: 13px; font-style: normal; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bay-blue);\">Winter 2025 cohort<\u002Fcite>\n        <\u002Fblockquote>\n        <blockquote style=\"margin: 0; background: rgba(255,255,255,0.06); border-top: 3px solid var(--bay-blue); padding: 26px 24px;\">\n          <p style=\"font-size: 17px; line-height: 1.55; margin: 0 0 16px; color: rgba(255,255,255,0.95);\">The course has been a highly useful tool as I make a mid-career switch from public equity markets to real estate development and investing.<\u002Fp>\n          <cite style=\"font-size: 13px; font-style: normal; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bay-blue);\">Winter 2025 cohort<\u002Fcite>\n        <\u002Fblockquote>\n        <blockquote style=\"margin: 0; background: rgba(255,255,255,0.06); border-top: 3px solid var(--bay-blue); padding: 26px 24px;\">\n          <p style=\"font-size: 17px; line-height: 1.55; margin: 0 0 16px; color: rgba(255,255,255,0.95);\">I have gained valuable knowledge that has significantly benefited my work in asset management, leading to a tremendous improvement in my analysis and underwriting skills.<\u002Fp>\n          <cite style=\"font-size: 13px; font-style: normal; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bay-blue);\">Fall 2024 cohort<\u002Fcite>\n        <\u002Fblockquote>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8. WHAT YOU WILL LEARN -->\n  <section style=\"background: var(--cream); padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--wharton-red); margin-bottom: 14px;\">What you will learn<\u002Fdiv>\n      <h2 style=\"font-size: clamp(26px, 3.5vw, 36px); font-weight: 700; line-height: 1.12; color: var(--wharton-blue); margin: 0 0 40px; max-width: 640px;\">Eight weeks, one continuous build toward a complete model.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;\">\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 24px 24px;\">\n          <div style=\"font-size: 18px; font-weight: 700; color: var(--wharton-blue); margin-bottom: 8px;\">Real estate cash flow modeling<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.5; color: var(--ink-muted); margin: 0;\">Build multi-year pro formas for multifamily, office, retail, and industrial assets.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 24px 24px;\">\n          <div style=\"font-size: 18px; font-weight: 700; color: var(--wharton-blue); margin-bottom: 8px;\">Debt, leverage, and financing<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.5; color: var(--ink-muted); margin: 0;\">Model senior debt, mezzanine, and refinancing; measure their effect on returns.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 24px 24px;\">\n          <div style=\"font-size: 18px; font-weight: 700; color: var(--wharton-blue); margin-bottom: 8px;\">Partnership waterfalls and promote<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.5; color: var(--ink-muted); margin: 0;\">Structure JV splits, preferred returns, and GP promote across return tiers.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 24px 24px;\">\n          <div style=\"font-size: 18px; font-weight: 700; color: var(--wharton-blue); margin-bottom: 8px;\">Development modeling<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.5; color: var(--ink-muted); margin: 0;\">Model ground-up development from land basis through stabilization and exit.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 24px 24px;\">\n          <div style=\"font-size: 18px; font-weight: 700; color: var(--wharton-blue); margin-bottom: 8px;\">Acquisition underwriting<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.5; color: var(--ink-muted); margin: 0;\">Underwrite deals end to end and stress-test the assumptions that drive value.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 24px 24px;\">\n          <div style=\"font-size: 18px; font-weight: 700; color: var(--wharton-blue); margin-bottom: 8px;\">Offering memoranda and presentation<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.5; color: var(--ink-muted); margin: 0;\">Package the analysis into institutional-format materials for investors.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; margin: 28px 0 0; color: var(--ink-muted);\">The full module-by-module breakdown ships with the syllabus. <a href=\"#lead-mid\" style=\"color: var(--pacific-blue); font-weight: 600; text-decoration: none;\">Get the syllabus<\u002Fa> to see it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- MID CTA BAND -->\n  <section id=\"lead-mid\" style=\"background: var(--wharton-blue-deep); color: #fff; padding: clamp(48px, 7vw, 80px) clamp(20px, 5vw, 40px); scroll-margin-top: 84px;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 56px); align-items: center;\">\n      <div style=\"flex: 1 1 340px;\">\n        <h2 style=\"font-size: clamp(26px, 3.5vw, 36px); font-weight: 700; line-height: 1.12; margin: 0 0 14px;\">See the full curriculum before you decide.<\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.5; color: rgba(255,255,255,0.82); margin: 0;\">The syllabus lists every module, the guest speakers, the weekly workload, and your tuition options including the $550 assistance and monthly plan.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 360px; min-width: 300px; max-width: 460px; background: var(--paper); color: var(--ink); border-radius: 4px; padding: clamp(22px, 3vw, 28px);\">\n        <form onsubmit=\"{{ onSubmit2 }}\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n            <input name=\"first_name\" type=\"text\" required=\"required\" placeholder=\"First name\" style=\"flex: 1 1 140px; min-width: 0; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n            <input name=\"email\" type=\"email\" required=\"required\" placeholder=\"Work email\" style=\"flex: 1 1 140px; min-width: 0; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n          <\u002Fdiv>\n          <select name=\"role\" required=\"required\" style=\"width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n            <option value=\"\" disabled=\"disabled\" selected=\"selected\">Current role<\u002Foption>\n            <option>CRE professional / broker / operator<\u002Foption>\n            <option>Acquisitions analyst<\u002Foption>\n            <option>Asset manager<\u002Foption>\n            <option>Career switcher into real estate<\u002Foption>\n            <option>Private / individual investor<\u002Foption>\n            <option>Student<\u002Foption>\n            <option>Other<\u002Foption>\n          <\u002Fselect>\n          <button type=\"submit\" style=\"width: 100%; font-family: inherit; background: var(--wharton-red); color: #fff; font-weight: 700; font-size: 17px; letter-spacing: 0.03em; padding: 15px; border: none; border-radius: 2px; cursor: pointer;\" style-hover=\"background: #7a0000;\">Get the Syllabus<\u002Fbutton>\n        <\u002Fform>\n        <sc-if value=\"{{ sent2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size: 14px; color: var(--wharton-red); font-weight: 600; margin: 12px 0 0;\">Thanks, {{ name2 }}. Your syllabus is on its way; check your inbox.<\u002Fp>\n        <\u002Fsc-if>\n        <p style=\"font-size: 13px; color: var(--ink-faint); margin: 12px 0 0;\">Full curriculum, guest speakers, and tuition options. No spam.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9. CERTIFICATE -->\n  <section style=\"background: var(--paper); padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(28px, 5vw, 56px); align-items: center;\">\n      <div style=\"flex: 1 1 380px;\">\n        <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--wharton-red); margin-bottom: 14px;\">The credential<\u002Fdiv>\n        <h2 style=\"font-size: clamp(26px, 3.5vw, 36px); font-weight: 700; line-height: 1.12; color: var(--wharton-blue); margin: 0 0 16px;\">A certificate from Wharton Online.<\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.55; color: var(--ink-muted); margin: 0;\">Finish the program and earn a certificate issued by Wharton Online. The program carries 65 CPE credits and is NASBA-registered, so the hours count toward your professional requirements.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 0 1 300px; display: flex; gap: 1px; background: var(--rule); border: 1px solid var(--rule);\">\n        <div style=\"flex: 1; background: var(--cream); padding: 28px 24px; text-align: center;\">\n          <div style=\"font-size: 40px; font-weight: 700; color: var(--wharton-blue); line-height: 1;\">65<\u002Fdiv>\n          <div style=\"font-size: 14px; color: var(--ink-muted); margin-top: 8px;\">CPE credits<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1; background: var(--cream); padding: 28px 24px; text-align: center;\">\n          <div style=\"font-size: 40px; font-weight: 700; color: var(--wharton-blue); line-height: 1;\">NASBA<\u002Fdiv>\n          <div style=\"font-size: 14px; color: var(--ink-muted); margin-top: 8px;\">registered<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10. TRANSPARENCY & RISK -->\n  <section style=\"background: var(--cream); padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--wharton-red); margin-bottom: 14px;\">Cost, time, and the honest version<\u002Fdiv>\n      <h2 style=\"font-size: clamp(26px, 3.5vw, 36px); font-weight: 700; line-height: 1.12; color: var(--wharton-blue); margin: 0 0 36px; max-width: 640px;\">Everything you would ask an advisor, stated plainly.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;\">\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 26px 24px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 10px;\">Tuition<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.5; color: var(--ink); margin: 0;\">$5,000, or $1,000 per month over five months. Employer reimbursement is supported.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 26px 24px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 10px;\">Tuition assistance<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.5; color: var(--ink); margin: 0;\">$550 in assistance is available to every applicant, with no income or background requirement.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 26px 24px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 10px;\">Time commitment<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.5; color: var(--ink); margin: 0;\">Plan for 8 to 10 hours per week at a minimum. The modeling work rewards more, and committed learners put in more.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid var(--rule); padding: 26px 24px;\">\n          <div style=\"font-size: 15px; font-weight: 700; color: var(--wharton-red); margin-bottom: 10px;\">If the timing is wrong<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.5; color: var(--ink); margin: 0;\">Cohorts run three times a year, in February, June, and October. Talk to an advisor about deferring to a later start.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11. FINAL CTA -->\n  <section id=\"lead-final\" style=\"background: var(--wharton-blue); color: #fff; padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 40px); scroll-margin-top: 84px;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 64px); align-items: flex-start;\">\n      <div style=\"flex: 1 1 380px;\">\n        <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bay-blue); margin-bottom: 14px;\">Start with the syllabus<\u002Fdiv>\n        <h2 style=\"font-size: clamp(28px, 4vw, 42px); font-weight: 700; line-height: 1.08; margin: 0 0 18px;\">See the full program before you commit a dollar.<\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.5; color: rgba(255,255,255,0.82); margin: 0 0 24px; max-width: 520px;\">Next cohort begins {{ cohortStart }}. Enrollment closes {{ enrollDeadline }}.<\u002Fp>\n        <p id=\"advisor\" style=\"font-size: 16px; margin: 0 0 6px; scroll-margin-top: 84px;\"><a href=\"#advisor\" style=\"color: #fff; font-weight: 600; text-decoration: underline; text-underline-offset: 3px;\">Talk to an Enrollment Advisor<\u002Fa> <span style=\"color: rgba(255,255,255,0.55);\">— get your questions answered before you apply.<\u002Fspan><\u002Fp>\n        <p style=\"font-size: 15px; margin: 14px 0 0;\"><a href=\"#lead-final\" style=\"color: rgba(255,255,255,0.6); text-decoration: underline; text-underline-offset: 3px;\">Ready to enroll now? Start your application.<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 380px; min-width: 300px; max-width: 460px; background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: 0 4px 12px rgba(0,26,54,0.2), 0 24px 48px rgba(0,26,54,0.24); padding: clamp(24px, 3vw, 32px);\">\n        <h3 style=\"font-size: 22px; font-weight: 700; color: var(--wharton-blue); margin: 0 0 6px;\">Get the full syllabus<\u002Fh3>\n        <p style=\"font-size: 15px; color: var(--ink-muted); margin: 0 0 20px;\">Curriculum, speakers, and tuition options in one PDF.<\u002Fp>\n        <form onsubmit=\"{{ onSubmit3 }}\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <input name=\"first_name\" type=\"text\" required=\"required\" placeholder=\"First name\" style=\"width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n          <input name=\"email\" type=\"email\" required=\"required\" placeholder=\"Work email\" style=\"width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n          <select name=\"role\" required=\"required\" style=\"width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;\">\n            <option value=\"\" disabled=\"disabled\" selected=\"selected\">Current role<\u002Foption>\n            <option>CRE professional / broker / operator<\u002Foption>\n            <option>Acquisitions analyst<\u002Foption>\n            <option>Asset manager<\u002Foption>\n            <option>Career switcher into real estate<\u002Foption>\n            <option>Private / individual investor<\u002Foption>\n            <option>Student<\u002Foption>\n            <option>Other<\u002Foption>\n          <\u002Fselect>\n          <button type=\"submit\" style=\"width: 100%; font-family: inherit; background: var(--wharton-red); color: #fff; font-weight: 700; font-size: 17px; letter-spacing: 0.03em; padding: 15px; border: none; border-radius: 2px; cursor: pointer;\" style-hover=\"background: #7a0000;\">Get the Syllabus<\u002Fbutton>\n        <\u002Fform>\n        <sc-if value=\"{{ sent3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size: 14px; color: var(--wharton-red); font-weight: 600; margin: 12px 0 0;\">Thanks, {{ name3 }}. Your syllabus is on its way; check your inbox.<\u002Fp>\n        <\u002Fsc-if>\n        <p style=\"font-size: 13px; color: var(--ink-faint); margin: 14px 0 0;\">Full curriculum, guest speakers, and tuition options. No spam.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12. FOOTER -->\n  <footer style=\"background: var(--wharton-blue-ink); color: rgba(255,255,255,0.72); padding: clamp(40px, 6vw, 64px) clamp(20px, 5vw, 40px) 32px;\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between; padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.14);\">\n        <img src=\"bb8ca66f-ff08-492d-bb42-c7212f8eb124\" alt=\"Wharton Online and Wall Street Prep\" style=\"height: 30px; width: auto;\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 40px;\">\n          <div>\n            <div style=\"font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 12px;\">Other programs<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <a href=\"#\" style=\"color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px;\">FP&amp;A Certificate<\u002Fa>\n              <a href=\"#\" style=\"color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px;\">Private Equity Certificate<\u002Fa>\n              <a href=\"#\" style=\"color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px;\">Applied Value Investing<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 12px;\">Contact<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <a href=\"mailto:support@wallstreetprep.com\" style=\"color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px;\">support@wallstreetprep.com<\u002Fa>\n              <a href=\"#advisor\" style=\"color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px;\">Talk to an advisor<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; padding-top: 24px; font-size: 13px; color: rgba(255,255,255,0.5);\">\n        <div>© 2026 Wall Street Prep, Inc. In collaboration with Wharton Online.<\u002Fdiv>\n        <div style=\"display: flex; gap: 20px;\">\n          <a href=\"#\" style=\"color: rgba(255,255,255,0.5); text-decoration: none;\">Privacy<\u002Fa>\n          <a href=\"#\" style=\"color: rgba(255,255,255,0.5); text-decoration: none;\">Terms<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { sent: {}, names: {} };\n\n  cohort() {\n    const now = new Date();\n    const months = [1, 5, 9]; // Feb, Jun, Oct (0-indexed)\n    const cands = [];\n    for (const yr of [now.getFullYear(), now.getFullYear() + 1]) {\n      for (const m of months) cands.push(new Date(yr, m, 12));\n    }\n    const start = cands.find(d => d > now) || cands[0];\n    const deadline = new Date(start);\n    deadline.setDate(start.getDate() - 7);\n    return { start, deadline };\n  }\n\n  fmt(d) { return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }\n  fmtShort(d) { return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' }); }\n\n  submit(which) {\n    return (e) => {\n      e.preventDefault();\n      let name = '';\n      try { name = (new FormData(e.target).get('first_name') || '').toString().trim(); } catch (err) {}\n      this.setState(s => ({\n        sent: Object.assign({}, s.sent, { [which]: true }),\n        names: Object.assign({}, s.names, { [which]: name })\n      }));\n    };\n  }\n\n  renderVals() {\n    const { start, deadline } = this.cohort();\n    return {\n      cohortStart: this.fmt(start),\n      cohortStartShort: this.fmtShort(start),\n      enrollDeadline: this.fmt(deadline),\n      sent1: !!this.state.sent[1],\n      sent2: !!this.state.sent[2],\n      sent3: !!this.state.sent[3],\n      name1: this.state.names[1] || '',\n      name2: this.state.names[2] || '',\n      name3: this.state.names[3] || '',\n      onSubmit1: this.submit(1),\n      onSubmit2: this.submit(2),\n      onSubmit3: this.submit(3)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
