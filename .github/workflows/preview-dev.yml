name: Deploy dev branch to stable preview URL

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ALIAS: wsp-analytics-dev.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        run: |
          set -euo pipefail
          npm i -g vercel
          # Vercel writes progress to stderr with ANSI control codes and prefixes
          # the result line with "Preview". Folding stderr in and grepping for
          # "https://" therefore captured the whole decorated line, so the alias
          # step below received several arguments instead of one URL and failed
          # on every run. Strip the escapes and extract just the URL token.
          raw=$(vercel --token "$VERCEL_TOKEN" --yes 2>&1 | tr -d '\r' | sed 's/\x1b\[[0-9;]*[A-Za-z]//g')
          url=$(printf '%s\n' "$raw" | grep -oE 'https://[A-Za-z0-9._-]+\.vercel\.app' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::No deployment URL found in vercel output"
            printf '%s\n' "$raw"
            exit 1
          fi
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Assign stable alias
        run: |
          set -euo pipefail
          vercel alias set "${{ steps.deploy.outputs.url }}" "$ALIAS" --token "$VERCEL_TOKEN"
          echo "Aliased $ALIAS -> ${{ steps.deploy.outputs.url }}"
